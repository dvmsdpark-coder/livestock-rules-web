name: Test and publish search site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF maintenance dependency
        run: python -m pip install -r maintenance/requirements.txt
      - name: Verify maintenance staging, review gates and rollback
        run: npm run test:maintenance
      - name: Verify source hashes, search behavior and public data
        run: npm test
      - name: Evaluate natural-language fixtures and every legal article
        run: npm run evaluate
      - name: Audit registered regulation links and reporting coverage
        run: npm run audit:links
      - name: Audit query wording, scope and negative controls
        run: npm run audit:questions
      - name: Verify published revisions and every cutover date
        run: npm run audit:release
      - name: Save search evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-evaluation
          path: |
            docs/search-evaluation.json
            docs/regulation-links.json
            docs/question-audit.json
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache source-version page images
        uses: actions/cache@v4
        with:
          path: site/assets/pages
          key: ${{ runner.os }}-page-previews-v2-${{ hashFiles('site/data/manifest.json', 'tools/build_page_previews.py') }}
          restore-keys: |
            ${{ runner.os }}-page-previews-v2-
      - name: Render mobile annex images from verified source PDFs
        run: |
          python -m pip install -r maintenance/preview-requirements.txt
          python tests/visual_regions_test.py
          python tests/page_furniture_test.py
          python tests/prose_flow_test.py
          python tools/build_page_previews.py
          python tools/build_annex_layouts.py
          python tests/annex_layouts_test.py
          node tools/verify_annex_layouts.mjs
          python tools/verify_page_previews.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
